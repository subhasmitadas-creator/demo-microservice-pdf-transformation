AWSTemplateFormatVersion: '2010-09-09'
Description: >
  OVERLAY — pdf-transformation demo workload in the Paligo playground account.

  Demo-grade and cost-minimised. It reuses the account's existing default VPC
  and public subnets rather than building its own, so there is no NAT gateway
  and no load balancer. Idle cost is effectively zero.

Parameters:
  ServiceName:
    Type: String
    Default: pdf-transformation-demo

  ImageTag:
    Type: String
    Description: Commit SHA, passed by the pipeline.

  BaseRegistryStack:
    Type: String
    Default: pdf-transformation-demo-base-registry

  # --- Existing account resources, discovered not created -----------------

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-d6a96faf
    Description: The account's default VPC (paligo-vpc, 172.31.0.0/16).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-84cbc8cc,subnet-d1433e8b,subnet-7493a312
    Description: >
      Existing PUBLIC subnets. Public matters: tasks reach ECR and CloudWatch
      through the VPC's internet gateway, which is free. A NAT gateway would
      cost ~$33/month and exists only to serve private subnets.

  AllowedCidr:
    Type: String
    Default: 178.174.143.114/32
    Description: >
      Who may reach the task port. Defaults to the IP this was set up from.
      Update it when your address changes — do not widen it to 0.0.0.0/0:
      the emulator invokes the handler for anyone who can connect, and the
      handler reads and writes S3.

  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the Lambda Runtime Interface Emulator binds.

  DesiredCount:
    Type: Number
    Default: 0
    Description: >
      0 by default so nothing runs, and nothing is billed, between demos.
      Scale to 1 for a demo (~$0.03/hour) and back to 0 afterwards.

Resources:

  # =========================================================================
  # ECS — reuses the existing VPC; the cluster itself is free
  # =========================================================================

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Restricted ingress to ${ServiceName} demo tasks'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          CidrIp: !Ref AllowedCidr
          Description: Demo access from a single address only

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ServiceName}'
      RetentionInDays: 7

  # A dedicated cluster rather than the account's existing `microservices` or
  # `sample` clusters: clusters are free, so isolation costs nothing and the
  # demo can be deleted without touching anyone else's workloads.
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ServiceName}-cluster'

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # =========================================================================
  # Shared IAM — the ECS task and the Lambda run the same handler, so they
  # get the same S3 permissions and nothing more.
  # =========================================================================

  S3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read source PDFs from the inbound bucket, write results to outbound.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadSourceObjects
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub
              - 'arn:aws:s3:::${Bucket}/*'
              - Bucket: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-InboundBucket'}

          - Sid: WriteTransformedObjects
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:AbortMultipartUpload
            Resource: !Sub
              - 'arn:aws:s3:::${Bucket}/*'
              - Bucket: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-OutboundBucket'}

          - Sid: ListForClearErrors
            Effect: Allow
            # Without ListBucket a missing key returns 403 instead of 404,
            # which makes S3DownloadFailedError impossible to diagnose.
            Action: s3:ListBucket
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}'
                - Bucket: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-InboundBucket'}
              - !Sub
                - 'arn:aws:s3:::${Bucket}'
                - Bucket: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-OutboundBucket'}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref S3AccessPolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      # The image is built --platform linux/arm64, so Fargate must match.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-RepositoryUri'}
          # Prepend the Runtime Interface Emulator to the image's own
          # entrypoint so the unchanged handler is reachable over HTTP. No
          # application code differs between the Lambda and ECS paths.
          EntryPoint:
            - /aws-lambda/aws-lambda-rie
            - poetry
            - run
            - python
            - -m
            - awslambdaric
          Command: ['src/main.handler']
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: PYTHONPATH
              Value: /function/src
            # FileService reads both in __init__; unset means every transfer fails.
            - Name: SERVICE_DELIVERY_BUCKET
              Value: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-InboundBucket'}
            - Name: SERVICE_RECEIVE_BUCKET
              Value: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-OutboundBucket'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnet + public IP replaces a NAT gateway. The security
          # group, not the subnet, is what keeps the task private.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]

  # =========================================================================
  # Lambda — same image, default entrypoint, free at demo volume
  # =========================================================================

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref S3AccessPolicy

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref ServiceName
      PackageType: Image
      Architectures: [arm64]
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      MemorySize: 2048
      Environment:
        Variables:
          SERVICE_DELIVERY_BUCKET: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-InboundBucket'}
          SERVICE_RECEIVE_BUCKET: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-OutboundBucket'}
      Code:
        ImageUri: !Sub
          - '${Repo}:${ImageTag}'
          - Repo: !ImportValue {'Fn::Sub': '${BaseRegistryStack}-RepositoryUri'}

Outputs:
  LambdaFunctionName:
    Description: Invoke with `aws lambda invoke --function-name <this>`.
    Value: !Ref LambdaFunction

  ClusterName:
    Description: Scale to 1 for a demo, back to 0 after.
    Value: !Ref Cluster

  ScaleUpCommand:
    Value: !Sub 'aws ecs update-service --cluster ${Cluster} --service ${ServiceName} --desired-count 1'
