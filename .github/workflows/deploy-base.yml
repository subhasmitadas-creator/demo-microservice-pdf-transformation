name: Deploy base layer

# The base layer is long-lived: a VPC, a NAT gateway, an ECR repository and two
# Retain-on-delete buckets. It must exist before the first workload deploy, and
# after that it changes almost never — so it is deliberately NOT on the
# per-commit path.
on:
  push:
    branches: [main]
    paths:
      - 'infra/base/**'
      - '.github/workflows/deploy-base.yml'
  workflow_dispatch:

concurrency:
  group: deploy-base
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  SERVICE_NAME: pdf-transformation-demo
  OIDC_ROLE: arn:aws:iam::230763337748:role/GithubActionsOidc-pdf-transformation-demo

jobs:
  base:
    name: Network and registry
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Registry first: it has no dependency on the network, and the workload
      # cannot be pushed to until it exists.
      - name: Deploy registry
        run: |
          aws cloudformation deploy \
            --template-file infra/base/registry.yaml \
            --stack-name "${SERVICE_NAME}-base-registry" \
            --no-fail-on-empty-changeset \
            --parameter-overrides ServiceName="$SERVICE_NAME"

      - name: Deploy network
        run: |
          aws cloudformation deploy \
            --template-file infra/base/network.yaml \
            --stack-name "${SERVICE_NAME}-base-network" \
            --no-fail-on-empty-changeset

      - name: Show exports
        run: |
          {
            echo "### Base layer exports"
            echo '```'
            aws cloudformation list-exports \
              --query "Exports[?starts_with(Name, '${SERVICE_NAME}-base')].[Name,Value]" \
              --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
