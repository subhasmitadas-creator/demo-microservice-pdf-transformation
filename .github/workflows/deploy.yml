name: Build, scan and deploy

# Everything, in one run: ensure the registry exists, build the image, scan it,
# push it, then deploy the workload. Networking is the account's existing
# default VPC, not something we create.
#
# The registry stack is deployed on every run rather than guarded behind a
# separate manual workflow. It holds only an ECR repository and two buckets,
# all Retain-on-delete, so re-deploying is a no-op changeset that costs a few
# seconds — much cheaper than a manual step that is easy to forget.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write         # required to request the OIDC token
  contents: read
  security-events: write  # to upload Trivy results to code scanning

env:
  AWS_REGION: eu-west-1
  SERVICE_NAME: pdf-transformation-demo
  STACK_NAME: pdf-transformation-demo-workload
  OVERLAY: infra/overlays/playground
  OIDC_ROLE: arn:aws:iam::230763337748:role/GithubActionsOidc-pdf-transformation-demo

jobs:
  deploy:
    name: Deploy to playground
    # arm64 runner: the image is built for linux/arm64 to match Fargate's
    # RuntimePlatform and Lambda's arm64 architecture. Building on x86 would
    # need QEMU emulation and take far longer.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Creates the ECR repository and the two S3 buckets on a first run;
      # a no-op changeset on every run after that.
      - name: Ensure base layer (ECR + buckets)
        run: |
          aws cloudformation deploy \
            --template-file infra/base/registry.yaml \
            --stack-name "${SERVICE_NAME}-base-registry" \
            --no-fail-on-empty-changeset \
            --parameter-overrides ServiceName="$SERVICE_NAME"

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -f deploy/Dockerfile -t "$IMAGE_URI" --platform linux/arm64 .
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          # exit-code stays 0 so the SARIF upload always runs; the gate is the
          # separate step below.
          exit-code: '0'

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        # always() so results still upload when the gate below fails — but only
        # if the scan actually produced a file. Without the hashFiles guard this
        # step fails noisily on any run that stopped before the scan.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # DEMO THRESHOLD — blocks on CRITICAL only.
      #
      # The image carries 27 HIGH and 0 CRITICAL findings. 18 of the HIGHs are
      # Go stdlib CVEs inside the aws-lambda-rie binary, which only AWS can
      # rebuild; the remainder need a newer Debian base or a poetry 2.x upgrade
      # that this repo's 1.x lock file would reject.
      #
      # HIGH findings are still scanned and still published to the Security tab
      # by the step above — visible, just not blocking. For anything beyond a
      # demo this must return to HIGH,CRITICAL and the RIE dependency should be
      # dropped.
      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Only reached if the scan passed — a vulnerable image never enters ECR.
      - name: Push to ECR
        run: docker push "$IMAGE_URI"
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy overlay (ECS service and Lambda)
        run: |
          aws cloudformation deploy \
            --template-file "$OVERLAY/workload.yaml" \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides ImageTag="${{ github.sha }}"

      - name: Summarise
        run: |
          {
            echo "### Deployed \`${{ github.sha }}\`"
            echo
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' --output text \
              | awk -F'\t' 'BEGIN{print "| Output | Value |"; print "|---|---|"} {print "| "$1" | "$2" |"}'
          } >> "$GITHUB_STEP_SUMMARY"
